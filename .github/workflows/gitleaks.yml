name: Gitleaks Scan

# Trigger the scan on pushes, pull requests, or manually
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # Allows you to trigger it manually via the Actions tab

jobs:
  scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code. 
      # CRITICAL: fetch-depth must be 0 to scan the entire git history.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Run the Gitleaks Marketplace Action
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: GITLEAKS_LICENSE is required ONLY for corporate GitHub Organizations. 
          # It is completely free and unneeded for personal user accounts.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} 
